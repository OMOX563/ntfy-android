name: Build FxxkPush APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 打 tag 建 Release 时需要
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create keystore from PEM
        run: |
          echo "${{ secrets.KEY_PEM_B64 }}" | base64 -d > /tmp/key.pem
          echo "${{ secrets.CERT_PEM_B64 }}" | base64 -d > /tmp/cert.pem
          openssl pkcs12 -export \
            -in /tmp/cert.pem -inkey /tmp/key.pem \
            -out /tmp/fxxkpush.p12 \
            -name fxxkpush \
            -passout pass:${{ secrets.KEYSTORE_PASS }} \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          keytool -list -keystore /tmp/fxxkpush.p12 \
            -storepass ${{ secrets.KEYSTORE_PASS }} \
            -storetype PKCS12 | grep fxxkpush
          echo "KEYSTORE_PATH=/tmp/fxxkpush.p12" >> $GITHUB_ENV

      - name: Build fdroid release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: fxxkpush
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -o pipefail
          # 全量落盘：gh/gh-CLI 与网页日志都会截断长输出，编译错误正文常被吃掉。
          # 落成文件后 grep 出 e: file 与 .kt:行:列，作为 artifact 上传，便于精确取错误。
          ./gradlew :app:assembleFdroidRelease --stacktrace --info > build-full.log 2>&1 || {
            echo "===== 编译错误摘要 ====="
            grep -nE "^e: file:|\.kt:[0-9]+:[0-9]+|error:|What went wrong|^> " build-full.log | head -40 || true
            echo "===== 末尾 60 行 ====="
            tail -60 build-full.log
            exit 1
          }
          tail -5 build-full.log

      - name: Rename APK
        run: |
          VERSION=$(grep versionName app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          SRC=app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          cp "$SRC" "FxxkPush-${VERSION}-android.apk"
          echo "APK_PATH=FxxkPush-${VERSION}-android.apk" >> $GITHUB_ENV
          ls -lh "FxxkPush-${VERSION}-android.apk"

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-full.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fxxkpush-apk
          path: ${{ env.APK_PATH }}
          retention-days: 7

      - name: Create Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
