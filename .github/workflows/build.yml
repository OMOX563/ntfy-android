name: Build FxxkPush APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create keystore from PEM
        run: |
          echo "${{ secrets.KEY_PEM_B64 }}" | base64 -d > /tmp/key.pem
          echo "${{ secrets.CERT_PEM_B64 }}" | base64 -d > /tmp/cert.pem
          openssl pkcs12 -export \
            -in /tmp/cert.pem -inkey /tmp/key.pem \
            -out /tmp/fxxkpush.p12 \
            -name fxxkpush \
            -passout pass:${{ secrets.KEYSTORE_PASS }} \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          keytool -list -keystore /tmp/fxxkpush.p12 \
            -storepass ${{ secrets.KEYSTORE_PASS }} \
            -storetype PKCS12 | grep fxxkpush
          echo "KEYSTORE_PATH=/tmp/fxxkpush.p12" >> $GITHUB_ENV

      - name: Build fdroid release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: fxxkpush
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: ./gradlew :app:assembleFdroidRelease

      - name: Rename APK
        run: |
          VERSION=$(grep versionName app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          SRC=app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          cp "$SRC" "FxxkPush-${VERSION}-android.apk"
          echo "APK_PATH=FxxkPush-${VERSION}-android.apk" >> $GITHUB_ENV
          ls -lh "FxxkPush-${VERSION}-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fxxkpush-apk
          path: ${{ env.APK_PATH }}
          retention-days: 7

      - name: Create Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
