buildscript {
    ext.kotlin_version = '2.2.10'
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // FxxkPush P2 重做 · Compose：Kotlin 2.0+ 起 Compose 编译器是独立 Gradle 插件，
        // 不再随 kotlin-android 附带。版本必须与 kotlin_version 对齐，
        // 不对齐会在 configuring project ':app' 阶段直接失败（不是编译期）。
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.4' // This is removed in the "fdroid" flavor

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id 'com.google.devtools.ksp' version '2.3.2'
}
